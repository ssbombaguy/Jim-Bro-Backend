name: Check missed workouts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # the backend runs on Render's free plan, which spins the service down after ~15 idle
      # minutes — and this cron fires every 30, so every run hits a cold instance. One bare
      # curl with no timeout used to hang on Render's proxy for as long as it held the
      # request (7+ minutes) and then fail on the proxy's eventual 5xx. Waking the service
      # against /health first (cheap, no side effects, safe to hammer) turns the real call
      # into a warm-instance request.
      - name: Wake the backend
        run: |
          curl -sS -f --retry 10 --retry-all-errors --retry-delay 15 --max-time 60 \
            "${{ secrets.BACKEND_URL }}/health"
      # retrying the job call is safe: the endpoint claims each split/date once via
      # ON CONFLICT DO NOTHING, so a retry after a half-finished run can't double-notify
      - name: Call missed-workout job endpoint
        run: |
          curl -sS -X POST "${{ secrets.BACKEND_URL }}/jobs/check-missed-workouts" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --retry 3 --retry-all-errors --retry-delay 20 --max-time 120 \
            -w "\nHTTP %{http_code}\n" --fail-with-body
